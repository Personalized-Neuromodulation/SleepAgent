project:
  name: SleepAgent
  workflow: knowledge_grounding

paths:
  seed_papers: data/literature/seed_papers.csv
  fixture_seed_papers: data/fixtures/toy_seed_papers.csv
  foundation_dir: data/foundation
  fixtures_dir: data/fixtures
  feature_registry: data/foundation/feature_registry.csv
  approved_variables: data/foundation/approved_variables.yaml
  data_dictionary: data/foundation/data_dictionary.yaml
  qc_summary: data/foundation/qc_summary.csv
  multimodal_master_table: data/foundation/multimodal_master_table.csv
  fixture_feature_registry: data/fixtures/toy_feature_registry.csv
  fixture_approved_variables: data/fixtures/toy_approved_variables.yaml
  fixture_multimodal_master_table: data/fixtures/toy_multimodal_master_table.csv
  mechanism_templates: configs/mechanism_templates.yaml
  variable_mapping_rules: configs/variable_mapping_rules.yaml
  output_grounding_dir: outputs/grounding
  output_profiles_dir: outputs/profiles
  report_path: reports/grounding_report.md

retrieval:
  enabled: false
  query: sleep insomnia thalamocortical slow wave spindle
  top_k: 20

data_profile:
  max_missing_rate: 0.4
  min_n_available: 2
  accepted_qc_status:
    - pass
    - usable

evidence:
  default_population: sleep cohort

api:
  enabled: false
  fail_open: true
  cache_enabled: true
  cache_dir: .cache/sleepagent_api
  timeout_seconds: 20
  max_retries: 3
  backoff_seconds: 1.5
  max_results_per_query: 20
  providers:
    pubmed:
      enabled: true
      email_env: NCBI_EMAIL
      tool_env: NCBI_TOOL
      api_key_env: NCBI_API_KEY
      base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
      requests_per_second_without_key: 3
      requests_per_second_with_key: 10
    europe_pmc:
      enabled: true
      base_url: https://www.ebi.ac.uk/europepmc/webservices/rest
      email_env: EUROPE_PMC_EMAIL
      requests_per_second: 3
    openalex:
      enabled: true
      base_url: https://api.openalex.org
      api_key_env: OPENALEX_API_KEY
      requests_per_second: 5
    semantic_scholar:
      enabled: true
      base_url: https://api.semanticscholar.org/graph/v1
      api_key_env: SEMANTIC_SCHOLAR_API_KEY
      requests_per_second: 1
  search_queries:
    - insomnia slow wave EEG
    - insomnia thalamocortical fMRI
    - insomnia spindle EEG fMRI
    - insomnia DTI white matter
    - sleep slow wave thalamus functional connectivity
    - sleep spindle thalamocortical connectivity
    - insomnia default mode network fMRI
    - insomnia hippocampus thalamus MRI
    - insomnia PSQI ISI EEG
  output:
    api_literature_csv: data/literature/api_retrieved_papers.csv
    api_literature_jsonl: data/literature/api_retrieved_papers.jsonl
    api_search_log: outputs/grounding/api_search_log.jsonl
