project:
  name: SleepAgent
  workflow: knowledge_grounding

runtime:
  allow_fixtures: false

paths:
  database_config: configs/database_config.yaml
  literature_library_config: configs/literature_library_config.yaml
  feature_registry: data/foundation/feature_registry.csv
  approved_variables: data/foundation/approved_variables.yaml
  qc_summary: data/foundation/qc_summary.csv
  multimodal_master_table: data/foundation/multimodal_master_table.csv
  mechanism_templates: configs/mechanism_templates.yaml
  variable_mapping_rules: configs/variable_mapping_rules.yaml
  evidence_extraction_rules: configs/evidence_extraction_rules.yaml
  llm_config: configs/llm_config.yaml
  output_grounding_dir: outputs/grounding
  output_profiles_dir: outputs/profiles
  report_path: reports/phase1_grounding_report.md
  literature_registry_csv: outputs/grounding/grounding_literature_registry.csv
  literature_registry_jsonl: outputs/grounding/grounding_literature_registry.jsonl
  literature_deduplication_report: outputs/grounding/literature_deduplication_report.csv
  corpus_manifest: outputs/grounding/corpus_manifest.json

retrieval:
  source: literature_db_rag
  query: sleep insomnia thalamocortical slow wave spindle
  top_k: 20

data_profile:
  max_missing_rate: 0.4
  min_n_available: 2
  accepted_qc_status:
    - pass
    - usable

evidence:
  default_population: sleep cohort
  preferred_mechanisms:
    - slow-wave generation
    - spindle generation
    - thalamocortical coupling
    - insomnia severity
    - hyperarousal
    - white matter integrity
    - default mode network dysregulation
    - salience network dysregulation
    - limbic structural vulnerability

llm_context_compression:
  enabled: true
  max_total_evidence: 500
  max_evidence_per_mechanism: 50
  max_unclear_fraction: 0.25
  max_graph_edges: 2000
