llm_provider: ollama

online_llm:
  enabled: true
  provider: online
  base_url: https://api.deepseek.com
  api_key: ${DEEPSEEK_API_KEY}
  model: deepseek-chat
  timeout: 300
  temperature: 0.2
  max_retries: 3
  disable_thinking: true
  debate_rating_threshold: 1400
  fallback_to_rules: false

ollama:
  enabled: true
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3:14b
  timeout: 600
  temperature: 0.2
  debate_rating_threshold: 1400
  fallback_to_rules: false
  log_calls: true

llm_profiles:
  default:
    enabled: true
    provider: ollama
    base_url: http://localhost:11434
    model: qwen3:14b
    timeout: 600
    temperature: 0.2
    fallback_to_rules: false
    log_calls: true
  reasoning:
    enabled: true
    provider: ollama
    base_url: http://localhost:11434
    model: qwen3:14b
    timeout: 600
    temperature: 0.1
    fallback_to_rules: false
    log_calls: true
  coder:
    enabled: true
    provider: ollama
    base_url: http://localhost:11434
    model: deepseek-coder-v2:16b
    timeout: 600
    temperature: 0.0
    fallback_to_rules: false
    log_calls: true
  disabled:
    enabled: false
    provider: rules
    model: deterministic
    fallback_to_rules: true
    log_calls: false

llm_tasks:
  hypothesis_generation: default
  hypothesis_review: reasoning
  hypothesis_rank: default
  hypothesis_evolution: reasoning
  hypothesis_meta_review: disabled
  experiment_design: default
  experiment_statistical_model: default
  experiment_result_review: reasoning
  literature_intent: default

llm:
  enabled: false
  provider: openai
  model: gpt-4.1-mini
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_tokens: 1500
  timeout_seconds: 30
  max_retries: 2
  fail_open: true
  cache_enabled: true
  cache_dir: .cache/sleepagent_llm
  log_file: outputs/grounding/llm_extraction_log.jsonl

evidence_extraction:
  llm_assist_enabled: false
  only_for_ambiguous: true
  confidence_low: 0.35
  confidence_high: 0.70
  max_sentences_per_paper: 8
  max_llm_calls_per_build: 200
  require_json_output: true
  require_source_text_match: true
  allow_claim_split: true
  allow_field_completion: true
  allow_direction_revision: true
  allow_new_evidence_from_same_source_text: true
  disallow_new_evidence_without_rule_trigger: true
