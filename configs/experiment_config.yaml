experiment:
  top_k_hypotheses: 1
  max_predictors: 4
  max_outcomes: 2
  primary_template: auto
  ml_models:
    - logistic_regression
    - decision_tree
    - random_forest
    - svm
    - xgboost
    - lightgbm
  ml_cv_folds: 5
  bootstrap_iterations: 100
  verbose: true

feature_extraction:
  enabled: true
  output_root: outputs/features
  modalities: auto
  fmri:
    input_root: ""
    derivatives_root: /data/fmri_agent/multimodal_sleep_data/bids/derivatives/FMRIPREP
    output_root: ""
    subjects: []
    features_csv: ""
  eeg:
    input_root: ""
    raw_root: ""
    raw_table: ""
    features_csv: ""
  scales:
    input_root: ""
    raw_root: ""
    raw_table: ""
    features_csv: ""
  dti:
    input_root: ""
    raw_root: ""
    raw_table: ""
    features_csv: ""
  mri:
    input_root: ""
    raw_root: ""
    raw_table: ""
    features_csv: ""

data_processing:
  enabled: false
  backend: fmri_local_split
  input_root: /data/fmri_agent/multimodal_sleep_data/bids/sourcedata
  output_root: /data/fmri_agent/multimodal_sleep_data
  derivatives_root: /data/fmri_agent/multimodal_sleep_data/bids/derivatives/FMRIPREP
  subjects: []
  surface_mode: "0"
  mni_template: both
  fs_license: ""
  subject_jobs:
  env: {}

paths:
  llm_config: configs/llm_config.yaml
  hypothesis_pool: outputs/hypotheses/hypothesis_pool.json
  data_profile: outputs/profiles/analysis_ready_profile.yaml
  approved_variables: outputs/grounding/approved_variables_from_grounding.yaml
  variable_mapping: outputs/grounding/evidence_to_variable_map.yaml
  experiment_output_dir: outputs/experiments
  experiment_results: outputs/experiments/experiment_results.json
  experimental_feedback: outputs/hypotheses/experimental_feedback.json
  experiment_report: reports/phase3_experiment_report.md
  experiment_visualizations: outputs/experiments/visuals
