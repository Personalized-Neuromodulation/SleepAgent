[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-ai-scientist"
version = "0.1.0"
description = "SleepAgent knowledge grounding and scientific loop system."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "requests>=2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sleep_ai_scientist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not postgres_live and not api_live and not llm_live'"
markers = [
  "postgres_live: tests that require PostgreSQL",
  "api_live: tests that call external literature APIs",
  "llm_live: tests that call external LLM APIs",
]
