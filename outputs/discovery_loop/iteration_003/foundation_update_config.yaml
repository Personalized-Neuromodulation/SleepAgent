  update_history: data/foundation/foundation_update_history.jsonl
  report: reports/phase0_foundation_report.md
subject_id:
  column: subject_id
  aliases:
  - participant_id
  - sub_id
  - sub
  - subject
group:
  column: group
  allowed_values:
  - HC
  - INS
modalities:
- EEG
- fMRI
- DTI
- MRI
- scales
qc:
  pass_values:
  - pass
  - PASS
  - ok
  - true
  - '1'
  caution_values:
  - caution
  - partial
  fail_values:
  - fail
  - FAIL
  - false
  - '0'
thresholds:
  max_missing_rate_primary: 0.2
  max_missing_rate_secondary: 0.35
