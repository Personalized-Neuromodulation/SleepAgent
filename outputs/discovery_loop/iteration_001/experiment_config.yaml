experiment:
  top_k_hypotheses: 1
  max_predictors: 4
  max_outcomes: 2
  primary_template: auto
  ml_models:
  - logistic_regression
  - decision_tree
  - random_forest
  - svm
  - xgboost
  - lightgbm
  ml_cv_folds: 5
  bootstrap_iterations: 100
  verbose: true
feature_extraction:
  enabled: true
  output_root: /home/zyb/Agent_skills/SleepAgent/outputs/discovery_loop/iteration_001/features
  modalities: auto
  fmri:
    input_root: ''
    derivatives_root: /data/fmri_agent/multimodal_sleep_data/bids/derivatives/FMRIPREP
