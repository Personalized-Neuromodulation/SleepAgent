query_file:
  version: sleepagent_experiment_feedback_incremental
  description: Incremental query set generated from experiment feedback for one discovery
    iteration.
query_sets:
  library:
    query_set:
      version: sleep_literature_queries_v2_broad_sleep_science_incremental
      description: Broad sleep science query set for SleepAgent Sleep AI Scientist.
    settings:
      max_results_per_query: 50
      providers:
      - pubmed
      - europe_pmc
      - openalex
      - semantic_scholar
      include_human: true
      include_animal: true
      include_cellular_molecular: true
      include_circuit_mechanisms: true
      include_reviews: true
      include_meta_analysis: true
      include_methods: true
    queries:
      experiment_feedback_expansion:
      - thalamocortical coupling and insomnia severity (ISI) fMRI studies
      - functional connectivity between thalamus and default mode network (DMN) in
        sleep disorders
      - 'thalamocortical dysregulation in insomnia: neuroimaging evidence'
      - DMN functional connectivity abnormalities in insomnia patients
      - default mode network (DMN) and thalamocortical interactions in sleep disorders
      - DMN dysregulation as a biomarker for insomnia severity
      - timefreq_fALFF and ALFF in insomnia neuroimaging studies
      - fMRI features predicting insomnia severity (ISI) in adults
