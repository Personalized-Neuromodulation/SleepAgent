query_file:
  version: sleepagent_experiment_feedback_incremental
  description: Incremental query set generated from experiment feedback for one discovery
    iteration.
query_sets:
  library:
    query_set:
      version: sleep_literature_queries_v2_broad_sleep_science_incremental
      description: Broad sleep science query set for SleepAgent Sleep AI Scientist.
    settings:
      max_results_per_query: 50
      providers:
      - pubmed
      - europe_pmc
      - openalex
      - semantic_scholar
      include_human: true
      include_animal: true
      include_cellular_molecular: true
      include_circuit_mechanisms: true
      include_reviews: true
      include_meta_analysis: true
      include_methods: true
    queries:
      experiment_feedback_expansion:
      - thalamus coord z global signal confound resting state fMRI sleep
      - thalamus coord z ISI sleep fMRI
      - White matter integrity AND salience network connectivity AND insomnia
      - Mediation of DMN connectivity by white matter microstructure in sleep disorders
      - Thalamus functional connectivity AND ISI AND fMRI
      - TBSS FA analysis in insomnia network connectivity studies
      - DTI-fMRI integration for network-specific connectivity in sleep disorders
      - Thalamus salience FC AND sleep quality AND ISI
