query_file:
  version: sleepagent_experiment_feedback_incremental
  description: Incremental query set generated from experiment feedback for one discovery
    iteration.
query_sets:
  library:
    query_set:
      version: sleep_literature_queries_v2_broad_sleep_science_incremental
      description: Broad sleep science query set for SleepAgent Sleep AI Scientist.
    settings:
      max_results_per_query: 50
      providers:
      - pubmed
      - europe_pmc
      - openalex
      - semantic_scholar
      include_human: true
      include_animal: true
      include_cellular_molecular: true
      include_circuit_mechanisms: true
      include_reviews: true
      include_meta_analysis: true
      include_methods: true
    queries:
      experiment_feedback_expansion:
      - Global signal power in thalamus-DMN FC studies of insomnia
      - Global_signal_psd as control in thalamus-salience FC in sleep disorders
      - Global_signal_psd modulation of thalamus network connectivity in insomnia
      - Thalamus FC and global_signal_psd in DMN and salience networks in insomnia
      - Global_signal_psd control in thalamus connectivity studies of sleep disorders
      - Mean_FD as covariate in thalamus-DMN FC in insomnia
      - Effect of mean_FD on thalamus-salience FC in sleep disorders
      - Mean_FD modulation of thalamus network connectivity in insomnia
