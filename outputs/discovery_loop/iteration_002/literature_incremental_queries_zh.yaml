query_file:
  version: sleepagent_experiment_feedback_incremental
  description_zh: 基于一次 discovery iteration 的实验反馈生成的增量文献检索 query 集。
query_sets:
  library:
    query_set:
      version: sleep_literature_queries_v2_broad_sleep_science_incremental
      description_zh: 面向 SleepAgent Sleep AI Scientist 的广义睡眠科学增量检索 query 集。
    settings:
      max_results_per_query: 50
      providers:
      - pubmed
      - europe_pmc
      - openalex
      - semantic_scholar
      include_human: true
      include_animal: true
      include_cellular_molecular: true
      include_circuit_mechanisms: true
      include_reviews: true
      include_meta_analysis: true
      include_methods: true
    queries:
      experiment_feedback_expansion:
      - query: Global signal power in thalamus-DMN FC studies of insomnia
        query_zh: 失眠研究中丘脑-DMN 功能连接分析里的全局信号功率
      - query: Global_signal_psd as control in thalamus-salience FC in sleep disorders
        query_zh: 睡眠障碍中丘脑-显著性网络功能连接研究里作为控制变量的 global_signal_psd
      - query: Global_signal_psd modulation of thalamus network connectivity in insomnia
        query_zh: global_signal_psd 对失眠中丘脑网络连接性的调节作用
      - query: Thalamus FC and global_signal_psd in DMN and salience networks in insomnia
        query_zh: 失眠中 DMN 和显著性网络的丘脑功能连接与 global_signal_psd
      - query: Global_signal_psd control in thalamus connectivity studies of sleep disorders
        query_zh: 睡眠障碍丘脑连接性研究中的 global_signal_psd 控制
      - query: Mean_FD as covariate in thalamus-DMN FC in insomnia
        query_zh: 失眠中丘脑-DMN 功能连接分析里作为协变量的 Mean_FD
      - query: Effect of mean_FD on thalamus-salience FC in sleep disorders
        query_zh: mean_FD 对睡眠障碍中丘脑-显著性网络功能连接的影响
      - query: Mean_FD modulation of thalamus network connectivity in insomnia
        query_zh: Mean_FD 对失眠中丘脑网络连接性的调节作用
