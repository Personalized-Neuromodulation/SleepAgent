[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paper-rag-postgres"
version = "0.2.0"
description = "Parse downloaded scientific papers and build a PostgreSQL/pgvector RAG corpus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.112,<1",
  "httpx>=0.27,<1",
  "lxml>=5.2,<7",
  "numpy>=1.26,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymupdf>=1.24,<2",
  "pyyaml>=6,<7",
  "sentence-transformers>=3,<6",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
paper-rag = "paper_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
