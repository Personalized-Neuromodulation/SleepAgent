services:
  postgres:
    image: postgres:16
    container_name: sleepagent-postgres
    environment:
      POSTGRES_USER: sleepagent
      POSTGRES_PASSWORD: sleepagent
      POSTGRES_DB: sleepagent
    ports:
      - "5432:5432"
    volumes:
      - sleepagent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleepagent -d sleepagent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sleepagent_postgres_data:
